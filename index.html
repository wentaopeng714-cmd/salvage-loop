<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salvage Loop</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#162024;color:#d9e5df;font:15px system-ui,sans-serif}.app{width:min(1000px,94vw);margin:auto;padding:24px 0}header{display:flex;justify-content:space-between;border-bottom:2px solid #38535a;padding-bottom:14px}h1{margin:0;color:#6fd0be}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:18px}.panel,.resource,button{background:#1e2c31;border:1px solid #42616a;color:#e2ece8;border-radius:8px}.panel{padding:16px}.resource{padding:12px;display:flex;justify-content:space-between;margin:7px 0}.resource b{color:#79d5c2;font-size:19px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{padding:11px;cursor:pointer;font-weight:800}button:hover{background:#294047}button:disabled{opacity:.4}.log{height:140px;overflow:auto;color:#9eb5b4;font:13px ui-monospace,monospace}.job{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;margin:8px 0;padding:9px;background:#172327;border-radius:7px}.job input{width:48px;background:#0f171a;color:#fff;border:1px solid #456;padding:6px}.bar{height:9px;background:#0d1518;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#69cdb9}.overlay{position:fixed;inset:0;background:#0e1618e8;display:grid;place-items:center;padding:20px}.modal{max-width:450px;background:#1e2c31;border:1px solid #4f747e;border-radius:12px;padding:28px;text-align:center}.hide{display:none}@media(max-width:720px){.layout{grid-template-columns:1fr}.actions{grid-template-columns:1fr}header{gap:12px}}
</style></head><body><div class="app"><header><div><h1>Salvage Loop</h1><small>Rebuild a quiet settlement from useful scraps</small></div><button id="sound">♪ ON</button></header><div class="layout"><section><div class="panel"><h2>Stockpile</h2><div id="resources"></div><button id="scavenge">SCAVENGE +1 SCRAP</button></div><div class="panel"><h2>Build</h2><div class="actions" id="build"></div></div></section><section><div class="panel"><h2>Assign survivors</h2><p>Available: <b id="free">0</b></p><div id="jobs"></div></div><div class="panel"><h2>Settlement</h2><div class="bar"><i id="hope"></i></div><p>Hope <b id="hopeText">0</b> · Day <b id="day">1</b></p><div class="log" id="log"></div></div></section></div></div><div class="overlay" id="overlay"><div class="modal"><h2>Salvage Loop</h2><p>Search for scrap, build a water still, attract survivors, then assign them to automatic work. Your settlement keeps producing while you are away.</p><button id="start">BEGIN SCAVENGING</button></div></div><script>
const $=s=>document.querySelector(s);let S={scrap:0,parts:0,water:0,food:0,survivors:0,build:[0,0,0,0],jobs:[0,0,0],hope:0,day:1,last:Date.now()},sound=true,audio,musicTimer,step=0;const res=[['Scrap','scrap'],['Parts','parts'],['Water','water'],['Food','food'],['Survivors','survivors']],defs=[['Sorting Table','scrap',15],['Water Still','parts',12],['Garden Bed','water',20],['Shelter','parts',35]],jobDefs=[['Sorters',0],['Water crew',1],['Gardeners',2]];
function tone(f,d=.08,v=.015){if(!sound)return;audio=audio||new AudioContext;if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}function music(){clearInterval(musicTimer);tone(196);document.body.dataset.music='on';let n=[196,247,294,247,220,262];musicTimer=setInterval(()=>tone(n[step++%n.length],.2,.007),500)}function stopMusic(){clearInterval(musicTimer);document.body.dataset.music='off'}function free(){return Math.max(0,S.survivors-S.jobs.reduce((a,b)=>a+b,0))}function cost(i){return Math.ceil(defs[i][2]*Math.pow(1.5,S.build[i]))}function fmt(n){return n<1000?Math.floor(n):Math.floor(n/100)/10+'K'}function addLog(t){let l=$('#log');l.innerHTML=`<div>Day ${S.day}: ${t}</div>`+l.innerHTML}
function render(){$('#resources').innerHTML=res.map(r=>`<div class="resource"><span>${r[0]}</span><b>${fmt(S[r[1]])}</b></div>`).join('');$('#build').innerHTML='';defs.forEach((d,i)=>{let c=cost(i),b=document.createElement('button');b.textContent=`${d[0]} Lv.${S.build[i]} · ${c} ${d[1]}`;b.disabled=S[d[1]]<c;b.onclick=()=>{if(S[d[1]]>=c){S[d[1]]-=c;S.build[i]++;tone(520);if(i===3&&S.survivors<S.build[3]*2){S.survivors++;addLog('A new survivor joined the shelter.')}render()}};$('#build').appendChild(b)});$('#jobs').innerHTML='';jobDefs.forEach((d,i)=>{let el=document.createElement('div');el.className='job';el.innerHTML=`<span>${d[0]}</span><button>−</button><b>${S.jobs[i]}</b><button>+</button>`;let bs=el.querySelectorAll('button');bs[0].onclick=()=>{if(S.jobs[i])S.jobs[i]--;render()};bs[1].onclick=()=>{if(free())S.jobs[i]++;render()};$('#jobs').appendChild(el)});$('#free').textContent=free();$('#hope').style.width=Math.min(100,S.hope)+'%';$('#hopeText').textContent=Math.floor(S.hope);$('#day').textContent=S.day}
function tick(dt){let sort=(S.build[0]*.15+S.jobs[0]*.35)*dt,wat=(S.build[1]*.1+S.jobs[1]*.3)*dt,grow=(S.build[2]*.08+S.jobs[2]*.25)*dt;let use=Math.min(S.scrap,sort);S.scrap-=use;S.parts+=use*.5;S.water+=wat;let waterUse=Math.min(S.water,grow);S.water-=waterUse;S.food+=waterUse*.7;let eat=Math.min(S.food,S.survivors*.025*dt);S.food-=eat;S.hope=Math.max(0,Math.min(100,S.hope+(eat-S.survivors*.012*dt)));S.day=1+Math.floor((Date.now()-sessionStart)/12000);render()}
let sessionStart=Date.now();$('#scavenge').onclick=()=>{S.scrap++;tone(330);render()};$('#start').onclick=()=>{$('#overlay').classList.add('hide');music()};$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'♪ ON':'♪ OFF';sound?music():stopMusic()};function save(){S.last=Date.now();localStorage.salvageLoop=JSON.stringify(S)}function load(){try{let v=JSON.parse(localStorage.salvageLoop);if(v)S=v}catch{}let away=Math.min(14400,(Date.now()-S.last)/1000);tick(away*.5);render()}setInterval(()=>tick(.25),250);setInterval(save,3000);addEventListener('beforeunload',save);load();
</script></body></html>
